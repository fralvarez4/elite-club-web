name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps msedge
      - run: npm run lint
      - run: npm run build
      - run: npm run test:rate-limit
      - run: npm test -- --workers=3
      - run: npx playwright test --config playwright.admin.config.js
